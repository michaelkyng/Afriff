# Local development only. Hosted projects are configured separately.
# https://supabase.com/docs/guides/local-development/cli/config
project_id = "afriff"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
# New objects require explicit grants in their migration, in addition to RLS.
auto_expose_new_tables = false

[db]
port = 54322
shadow_port = 54320
# Align this with the hosted project's Postgres major version before linking.
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
# Add an exact callback URL when that route is implemented.
additional_redirect_urls = ["http://127.0.0.1:3000", "http://localhost:4173", "http://127.0.0.1:4173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
# The mock app's six-digit PIN is not a Supabase password policy.
minimum_password_length = 12

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "1m"
otp_length = 6
otp_expiry = 600

[edge_runtime]
enabled = true
policy = "per_worker"
inspector_port = 8083
deno_version = 2

[analytics]
enabled = false

[experimental.pgdelta]
enabled = true
