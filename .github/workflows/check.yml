name: Check workspaces

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  NUXT_TELEMETRY_DISABLED: '1'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: .
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node from .nvmrc
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Set up Bun from package.json
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install apps, layers and packages
        run: bun install --frozen-lockfile

      # Nuxt checks layers/ui-kit through the consuming PWA. Plain packages
      # (api, firebase, validation) and the Cloud Functions run their own checks.
      - name: Typecheck PWA, UI layer, functions and shared packages
        run: bun run typecheck

      - name: Test API, functions, programme logic and validation
        run: bun run test

      # What `firebase deploy` uploads: one bundle and a manifest naming only
      # the Firebase SDKs, since npm in the cloud cannot resolve workspaces.
      - name: Bundle Cloud Functions
        run: |
          bun run build:functions
          test -s apps/functions/dist/index.js
          node -e "const d = require('./apps/functions/dist/package.json').dependencies; const names = Object.keys(d).sort().join(','); if (names !== 'firebase-admin,firebase-functions') throw new Error('Unexpected deploy dependencies: ' + names)"

      - name: Generate static PWA
        run: bun run generate:pwa

      - name: Generate static scanner
        run: bun run generate:scanner

      - name: Verify PWA output and shared assets
        run: |
          pwa_output=apps/pwa/.output/public
          test -s "$pwa_output/index.html"
          test -s "$pwa_output/sw.js"
          test -s "$pwa_output/manifest.webmanifest"
          test -s "$pwa_output/brand/afriff-emblem-192.webp"
          test -s "$pwa_output/pwa-192x192.png"
          test -s "$pwa_output/pwa-512x512.png"
          compgen -G "$pwa_output/_nuxt/archivo-*.woff2" > /dev/null
          compgen -G "$pwa_output/_nuxt/onest-*.woff2" > /dev/null

      - name: Verify scanner output
        run: |
          door_output=apps/scanner/.output/public
          test -s "$door_output/index.html"
          test -s "$door_output/sw.js"
          test -s "$door_output/manifest.webmanifest"
          grep -q 'Disallow: /' "$door_output/robots.txt"

  rules:
    name: Firestore rules
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node from .nvmrc
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Set up Bun from package.json
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # The Firestore emulator runs on the JVM.
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache the Firestore emulator
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('bun.lock') }}

      - name: Install
        run: bun install --frozen-lockfile

      - name: Test the security rules against the emulator
        run: bun run test:rules
